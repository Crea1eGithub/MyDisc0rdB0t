<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea1e's Python IDE</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://googleapis.com"></script>
    <!-- Using stable Skulpt distribution -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

    <h1 class="text-3xl font-bold mb-6">My Python IDE</h1>

    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Left Panel: Code Editor -->
        <div class="bg-gray-800 p-4 rounded shadow">
            <h2 class="text-xl font-bold mb-2">Editor:</h2>
            <textarea id="code" class="w-full h-64 bg-gray-950 text-yellow-300 font-mono p-3 rounded border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Write your Python code here..."></textarea>
            <button onclick="runCode()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition w-full">
                Run Code
            </button>
        </div>

        <!-- Right Panel: Console & Tkinter Windows -->
        <div class="bg-gray-800 p-4 rounded shadow flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold mb-2">Output:</h2>
                <!-- Standard Text Console (print outputs) -->
                <pre id="output" class="text-green-400 font-mono whitespace-pre-wrap bg-gray-950 p-3 rounded border border-gray-700 min-h-[100px]"></pre>
            </div>
            
            <!-- Graphic Container dedicated for Tkinter / Turtle Windows -->
            <div class="mt-4">
                <h3 class="text-sm font-semibold text-gray-400 mb-1">Graphical Interface (Tkinter):</h3>
                <div id="tkinter-canvas" class="bg-gray-950 border border-gray-700 rounded p-2 min-h-[150px] flex items-center justify-center text-gray-600 font-mono text-sm">
                    Windows will render here...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Intercepts built-in and external Python modules
        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
                // Intercept when the user types "import tkinter"
                if (x === "src/lib/tkinter/__init__.js") {
                    return Sk.readUrl("https://githubusercontent.com");
                }
                throw "File not found: '" + x + "'";
            }
            return Sk.builtinFiles["files"][x];
        }

        function runCode() {
            const code = document.getElementById('code').value;
            const outputElement = document.getElementById('output');
            const canvasElement = document.getElementById('tkinter-canvas');
            
            // Clear previous outputs before each execution
            outputElement.innerText = '';
            canvasElement.innerHTML = ''; 

            // Redirect standard print() statements to our text box
            function outf(text) {
                outputElement.innerText += text;
            }

            // Skulpt engine configuration
            Sk.configure({
                output: outf,
                read: builtinRead,
                // Assign the HTML container where the emulator builds the UI
                graphicsContainer: canvasElement 
            });

            // Asynchronous code compilation and execution
            Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            }).then(function(mod) {
                console.log('Execution completed successfully!');
            }, function(err) {
                // If a Python syntax/runtime error occurs, append it to the console output
                outputElement.innerText += "\n" + err.toString();
            });
        }
    </script>
</body>
</html>
