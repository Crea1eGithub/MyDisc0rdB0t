<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE de Python de Crea1e</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://googleapis.com"></script>
    <!-- Asegúrate de usar la última versión de Skulpt para mayor compatibilidad -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

    <h1 class="text-3xl font-bold mb-6">Mi IDE de Python</h1>

    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Panel Izquierdo: Editor -->
        <div class="bg-gray-800 p-4 rounded shadow">
            <h2 class="text-xl font-bold mb-2">Editor:</h2>
            <textarea id="code" class="w-full h-64 bg-gray-950 text-yellow-300 font-mono p-3 rounded border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Escribe tu código Python aquí..."></textarea>
            <button onclick="runCode()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition w-full">
                Ejecutar Código
            </button>
        </div>

        <!-- Panel Derecho: Consola y Ventanas de Tkinter -->
        <div class="bg-gray-800 p-4 rounded shadow flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold mb-2">Resultado:</h2>
                <!-- Consola de Texto Estándar (Salidas de print) -->
                <pre id="output" class="text-green-400 font-mono whitespace-pre-wrap bg-gray-950 p-3 rounded border border-gray-700 min-h-[100px]"></pre>
            </div>
            
            <!-- Contenedor Gráfico Exclusivo para Ventanas de Tkinter / Turtle -->
            <div class="mt-4">
                <h3 class="text-sm font-semibold text-gray-400 mb-1">Interfaz Gráfica (Tkinter):</h3>
                <div id="tkinter-canvas" class="bg-gray-950 border border-gray-700 rounded p-2 min-h-[150px] flex items-center justify-center text-gray-600 font-mono text-sm">
                    Las ventanas se dibujarán aquí...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función encargada de resolver e interceptar las librerías internas y externas
        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
                // Intercepta de forma dinámica la llamada cuando el usuario importa tkinter
                if (x === "src/lib/tkinter/__init__.js") {
                    return Sk.readUrl("https://githubusercontent.com");
                }
                throw "File not found: '" + x + "'";
            }
            return Sk.builtinFiles["files"][x];
        }

        function runCode() {
            const code = document.getElementById('code').value;
            const outputElement = document.getElementById('output');
            const canvasElement = document.getElementById('tkinter-canvas');
            
            // Limpiamos los paneles antes de cada ejecución
            outputElement.innerText = '';
            canvasElement.innerHTML = ''; 

            // Redirección de la función print estándar a nuestro recuadro de texto
            function outf(text) {
                outputElement.innerText += text;
            }

            // Configuración del motor de Skulpt
            Sk.configure({
                output: outf,
                read: builtinRead,
                // Le asignamos el contenedor HTML donde el emulador construirá la UI de Tkinter
                graphicsContainer: canvasElement 
            });

            // Ejecución asíncrona del código compilado por Skulpt
            Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            }).then(function(mod) {
                console.log('¡Ejecución completada con éxito!');
            }, function(err) {
                // Si ocurre un error de sintaxis o ejecución en Python, lo mandamos a la consola del IDE
                outputElement.innerText += "\n" + err.toString();
            });
        }
    </script>
</body>
</html>
